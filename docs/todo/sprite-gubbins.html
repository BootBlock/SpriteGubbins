  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            foundry: {
              50: '#f4f6f8',
              100: '#e5e9ee',
              200: '#ce96d8',
              700: '#1e293b',
              800: '#0f172a',
              900: '#060911',
              accent: '#6366f1',
              neon: '#06b6d4',
              gold: '#f59e0b',
              emerald: '#10b981',

  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #060911;
      color: #f3f4f6;
    }

    /* Ambient Background Grid & Animated Light Glows */
    .bg-grid-pattern {
      background-image: radial-gradient(rgba(99, 102, 241, 0.15) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.25); }
      50% { box-shadow: 0 0 32px rgba(6, 182, 212, 0.55); }
    }

    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-20px) scale(1.1); }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .animate-fade-in {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .glow-box {
      animation: pulseGlow 4s infinite ease-in-out;
    }

    .float-orb-1 {
      animation: floatOrb 10s ease-in-out infinite;
    }

    .float-orb-2 {
      animation: floatOrb 14s ease-in-out infinite reverse;
    }

    .shimmer-bg {
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
      animation: shimmer 3s infinite;
    }
    
    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #090d18;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
      border: 1px solid rgba(99, 102, 241, 0.25);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

</head>
<body class="bg-foundry-900 bg-grid-pattern text-slate-100 min-h-screen relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">
  
  <!-- AMBIENT GLOW ORBS -->
  <div class="fixed -top-40 -left-40 w-[500px] h-[500px] bg-indigo-600/15 rounded-full blur-[120px] pointer-events-none float-orb-1"></div>
  <div class="fixed top-1/2 -right-40 w-[450px] h-[450px] bg-cyan-600/15 rounded-full blur-[120px] pointer-events-none float-orb-2"></div>
  <div class="fixed -bottom-40 left-1/3 w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[140px] pointer-events-none"></div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- COLOR MAPPING HELPER FOR VISUAL SWATCHES ---
    const COLOR_HEX_MAP = {
      'cyan': '#06b6d4',
      'gold': '#f59e0b',
      'crimson': '#ef4444',
      'emerald': '#10b981',
      'violet': '#8b5cf6',
      'purple': '#a855f7',
      'acid green': '#84cc16',
      'plasma cyan': '#22d3ee',
      'copper': '#b45309',
      'obsidian': '#1e1e24',
      'charcoal': '#334155',
      'gunmetal': '#475569',
      'navy': '#1e3a8a',
      'silver': '#cbd5e1',
      'tan': '#d97706',
      'indigo': '#6366f1',
      'rust': '#9a3412',
      'white': '#ffffff',
      'chrome': '#f8fafc',
      'rose': '#f43f5e',
      'orange': '#f97316',
      'yellow': '#eab308',
      'blue': '#3b82f6',
      'red': '#dc2626',
      'green': '#16a34a',
      'bronze': '#d97706',
      'vermilion': '#ea580c',
      'teal': '#14b8a6',
      'amber': '#f59e0b'
    };

    function parseColorFromText(text) {
      if (!text) return null;
      const hexMatch = text.match(/#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})/);
      if (hexMatch) return hexMatch[0];

      const lower = text.toLowerCase();
      for (const [name, hex] of Object.entries(COLOR_HEX_MAP)) {
        if (lower.includes(name)) {
          return hex;
        }
      }
      return null;
    }

    function ColorSwatch({ colorText }) {
      const hex = parseColorFromText(colorText);
      if (!hex) return null;
      return (
        <span
          className="inline-block w-3.5 h-3.5 rounded-full border border-white/40 shadow-sm flex-shrink-0 ml-1.5 transition-transform hover:scale-125"
          style={{ backgroundColor: hex }}
          title={`Color visual preview: ${hex}`}
        />
      );
    }

    // --- ACCESSIBLE FLOATING TOOLTIP COMPONENT ---
    function Tooltip({ text, hint, direction = 'top' }) {
      const [visible, setVisible] = useState(false);
      if (!text) return null;

      return (
        <div className="relative inline-flex items-center ml-1 group" onMouseEnter={() => setVisible(true)} onMouseLeave={() => setVisible(false)}>
          <button
            type="button"
            className="text-slate-500 hover:text-cyan-400 text-[11px] w-4 h-4 rounded-full border border-slate-700/80 hover:border-cyan-400 flex items-center justify-center font-mono font-bold transition-colors cursor-help"
            aria-label="More information"
          >
            ⓘ
          </button>

          {visible && (
            <div className={`absolute z-50 w-64 bg-slate-950 border border-indigo-500/80 rounded-xl p-2.5 shadow-[0_10px_25px_rgba(0,0,0,0.8)] text-[11px] leading-relaxed text-slate-200 pointer-events-none animate-fade-in backdrop-blur-xl ${
              direction === 'bottom' ? 'top-6 left-0' : 'bottom-6 left-1/2 -translate-x-1/2'
            }`}>
              <p className="font-semibold text-cyan-300 mb-0.5">{hint || 'Field Guidance'}</p>
              <p className="text-slate-300 font-sans">{text}</p>
            </div>
          )}
        </div>
      );
    }

    function ComboBox({ label, value, onChange, options, placeholder, hint, tooltip }) {
      const [isOpen, setIsOpen] = useState(false);
      const containerRef = useRef(null);

      useEffect(() => {
        function handleClickOutside(event) {
          if (containerRef.current && !containerRef.current.contains(event.target)) {
            setIsOpen(false);
          }
        }
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      return (
        <div className="relative" ref={containerRef}>
          <label className="block font-semibold text-slate-300 mb-1 flex justify-between items-center text-xs">
            <span className="flex items-center gap-1">

            {hint && <span className="text-[10px] text-slate-500 font-normal">{hint}</span>}

          <div className="relative flex items-center">
            <input

              value={value || ''}

    // --- ENHANCED GAME DEV SPRITE ATLAS & GRID CALCULATOR MODAL ---
    function AtlasCalculatorModal({ directionalMode, aspectRatio, onClose }) {
      const [canvasDim, setCanvasDim] = useState('2048');
      const [paddingPx, setPaddingPx] = useState(4);
      const [hoveredIndex, setHoveredIndex] = useState(null);
      const [copiedMeta, setCopiedMeta] = useState(false);

      const count = directionalMode === 'SINGLE_DIRECTION_POSE_LIBRARY' ? 37 : (directionalMode === 'FULL_DIRECTIONAL_POSE_LIBRARY' ? 111 : 43);
      const cols = Math.ceil(Math.sqrt(count * (aspectRatio === 'WIDE_16_9' ? 1.5 : (aspectRatio === 'TALL_9_16' ? 0.75 : 1))));
      const rows = Math.ceil(count / cols);
      const dimension = parseInt(canvasDim, 10);
      const cellPx = Math.floor(dimension / cols);
      const activeCellContentPx = Math.max(0, cellPx - (paddingPx * 2));
      const estimatedCharPx = Math.floor(activeCellContentPx * 0.75);

      // GPU Power of Two Check
      const isPowerOfTwo = [512, 1024, 2048, 4096, 8192].includes(dimension);

      // JSON Engine Metadata generator for Godot / Unity / PixiJS
      const engineMetadata = useMemo(() => {
        return JSON.stringify({
          atlas: {
            texture_size: `${dimension}x${dimension}`,
            total_components: count,
            grid: { columns: cols, rows: rows },
            cell_size: { width: cellPx, height: cellPx },
            padding: paddingPx,
            usable_sprite_bounds: { width: activeCellContentPx, height: activeCellContentPx },
            power_of_two_vram_optimized: isPowerOfTwo
          }
        }, null, 2);
      }, [dimension, count, cols, rows, cellPx, paddingPx, activeCellContentPx, isPowerOfTwo]);

      const handleCopyMetadata = () => {
        const textArea = document.createElement('textarea');
        textArea.value = engineMetadata;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          setCopiedMeta(true);
          setTimeout(() => setCopiedMeta(false), 2500);
        } catch (err) {}
        document.body.removeChild(textArea);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fade-in">
          <div className="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-xl w-full p-6 shadow-2xl space-y-5">
            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
              <h3 className="text-base font-bold text-white flex items-center gap-2">
                <span className="text-indigo-400">📊</span> Game Dev Sprite Atlas & Grid Calculator
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg font-bold">✕</button>
            </div>

            <div className="space-y-4 text-xs">
              
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-300 font-semibold mb-1 flex items-center">
                    Atlas Canvas Resolution
                    <Tooltip text="Select target texture atlas dimensions. 2048px is recommended for high definition mobile/desktop game engines." hint="Canvas Resolution" />
                  </label>
                  <select
                    value={canvasDim}
                    onChange={(e) => setCanvasDim(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white font-mono"
                  >
                    <option value="512">512 × 512 px (Low-poly Retro)</option>
                    <option value="1024">1024 × 1024 px (Standard SD)</option>
                    <option value="2048">2048 × 2048 px (HD Atlas - Recommended)</option>
                    <option value="4096">4096 × 4096 px (Ultra HD Master Atlas)</option>
                    <option value="8192">8192 × 8192 px (Extreme Resolution)</option>
                  </select>
                </div>

                <div>
                  <label className="block text-slate-300 font-semibold mb-1 flex items-center">
                    Cell Padding / Bleed Gutter
                    <Tooltip text="Adds inner padding around each sprite cell to prevent texture bleeding and seam artifacts when rendered in game engines." hint="Cell Bleed Padding" />
                  </label>
                  <select
                    value={paddingPx}
                    onChange={(e) => setPaddingPx(parseInt(e.target.value, 10))}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white font-mono"
                  >
                    <option value="0">0 px (No Padding)</option>
                    <option value="2">2 px (Light Gutter)</option>
                    <option value="4">4 px (Standard Gutter - Recommended)</option>
                    <option value="8">8 px (Wide Bleed Buffer)</option>
                    <option value="16">16 px (Maximum Isolation)</option>
                  </select>
                </div>
              </div>

              {/* VRAM POWER OF TWO BADGE */}
              <div className="flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800 font-mono text-[11px]">
                <span className="text-slate-400">GPU VRAM Optimization Status:</span>
                {isPowerOfTwo ? (
                  <span className="text-emerald-400 font-bold flex items-center gap-1">
                    ✓ Power of 2 Compliant ({dimension}px)
                  </span>
                ) : (
                  <span className="text-amber-400 font-bold flex items-center gap-1">
                    ⚠ Non-PO2 Canvas Resolution
                  </span>
                )}
              </div>

              {/* METRICS GRID */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5 font-mono">
                <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                  <span className="text-slate-400 text-[10px] block">COMPONENTS</span>
                  <span className="text-amber-400 text-sm font-bold">{count} Parts</span>

                <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                  <span className="text-slate-400 text-[10px] block">GRID LAYOUT</span>
                  <span className="text-cyan-400 text-sm font-bold">{cols}×{rows} Grid</span>
                </div>
                <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                  <span className="text-slate-400 text-[10px] block">CELL SIZE</span>
                  <span className="text-indigo-400 text-sm font-bold">{cellPx}×{cellPx} px</span>

                  <span className="text-emerald-400 text-sm font-bold">{activeCellContentPx} px max</span>
                </div>
              </div>

              {/* INTERACTIVE GRID VISUALIZER WITH HOVER DATA */}
              <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                <div className="flex justify-between items-center text-[10px] font-mono text-slate-400">
                  <span>INTERACTIVE ATLAS LAYOUT ({cols}×{rows})</span>
                  <span>{hoveredIndex !== null ? `Slot #${hoveredIndex + 1}: Row ${Math.floor(hoveredIndex/cols)+1}, Col ${(hoveredIndex%cols)+1}` : 'Hover grid slot for info'}</span>
                </div>
                
                <div className="grid gap-1 bg-slate-900 p-2 rounded-lg border border-slate-800 aspect-square max-w-[210px] mx-auto" style={{ gridTemplateColumns: `repeat(${cols}, minmax(0, 1fr))` }}>
                  {Array.from({ length: cols * rows }).map((_, i) => (
                    <div
                      key={i}
                      onMouseEnter={() => setHoveredIndex(i)}
                      onMouseLeave={() => setHoveredIndex(null)}
                      className={`aspect-square rounded-xs transition-all cursor-pointer ${
                        i < count 
                          ? (hoveredIndex === i ? 'bg-cyan-400 scale-125 z-10 shadow-lg' : 'bg-indigo-500/40 border border-indigo-400/50 hover:bg-cyan-400/80') 
                          : 'bg-slate-800/20 border border-slate-800/40'
                      }`}
                    />
                  ))}
                </div>
              </div>

            </div>

            <div className="flex gap-2">
              <button
                onClick={handleCopyMetadata}
                className="flex-1 py-2.5 bg-slate-950 hover:bg-slate-800 border border-slate-700 text-cyan-300 text-xs font-bold rounded-xl transition-all shadow-md"
              >
                {copiedMeta ? '✓ Copied Atlas JSON!' : '📋 Copy Atlas Engine Spec (JSON)'}
              </button>
              <button
                onClick={onClose}
                className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition-all shadow-lg"
              >
                Done
              </button>
            </div>
          </div>
        </div>
      );
    }

            setCustomPresets(JSON.parse(stored));

      }, []);

        return generatePrompt(category, subject, output);

      const wordCount = useMemo(() => generatedPromptText.trim().split(/\s+/).length, [generatedPromptText]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);

          showToast('Failed to copy JSON');

        document.body.removeChild(textArea);

        element.download = `${(subject.species || 'sprite').toLowerCase().replace(/\s+/g, '-')}-prompt.md`;

        element.click();
        document.body.removeChild(element);
        showToast('Downloaded .md prompt file!');

        element.href = URL.createObjectURL(file);

          try {
            const imported = JSON.parse(event.target.result);

                      <label className="block font-semibold text-slate-300 mb-1 text-xs flex items-center">
                        Subject Category
                        <Tooltip text="Select the category of the subject (Humanoid, Monster, Prop, Item, or Building). Updates available default option pools." hint="Category Selection" />
                      </label>
                      <select
                        value={category}
                        onChange={(e) => handleCategoryChange(e.target.value)}
                        className="w-full bg-slate-950 border border-indigo-500/50 rounded-xl p-2.5 text-white text-xs font-bold focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-inner"
                      >
                        {Object.keys(CATEGORY_OPTIONS).map(catKey => (
                          <option key={catKey} value={catKey}>
                            {CATEGORY_OPTIONS[catKey].label}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div className="space-y-3.5 pt-1">
                      {CATEGORY_OPTIONS[category].fields.map((f) => (
                        <ComboBox
                          key={f.key}
                          label={f.label}
                          value={subject[f.key]}
                          onChange={(val) => setSubject({ ...subject, [f.key]: val })}
                          options={f.options}
                          tooltip={f.tooltip}
                        />
                      ))}
                    </div>
                  </div>

                  {/* EXPANDED OUTPUT CONFIGURATION */}
                  {}
                  <div className="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-5 shadow-2xl space-y-4 text-xs backdrop-blur-lg">
                    <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                      <h2 className="text-sm font-bold text-white flex items-center gap-2">
                        <span className="text-cyan-400">⚙️</span> 2. Output Configuration
                      </h2>
                      <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-mono">Technical Directives</span>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-300 mb-1 flex items-center">
                        Directional Coverage Mode
                        <Tooltip text="Controls total component isolation count: SINGLE (37 parts), CORE 3-WAY (43 parts), or FULL 3-WAY (111 parts)." hint="Directional Coverage" />
                      </label>
                      <select
                        value={output.directionalMode}
                        onChange={(e) => setOutput({...output, directionalMode: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500 font-mono"
                      >
                        <option value="SINGLE_DIRECTION_POSE_LIBRARY">SINGLE_DIRECTION_POSE_LIBRARY (37 components)</option>
                        <option value="CORE_DIRECTIONAL_VARIANTS">CORE_DIRECTIONAL_VARIANTS (43 components - Recommended)</option>
                        <option value="FULL_DIRECTIONAL_POSE_LIBRARY">FULL_DIRECTIONAL_POSE_LIBRARY (111 components)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-300 mb-1 flex items-center">
                        Surface Detail Intensity
                        <Tooltip text="Controls internal seam and fold complexity while strictly respecting global palette limits." hint="Surface Detail" />
                      </label>
                      <select
                        value={output.surfaceDetail}
                        onChange={(e) => setOutput({...output, surfaceDetail: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500 font-mono"
                      >
                        <option value="MINIMAL">MINIMAL (Base colors & essential joints only)</option>
                        <option value="CLEAN_PRODUCTION">CLEAN_PRODUCTION (Major panels & folds - Standard)</option>
                        <option value="DETAILED_PRODUCTION">DETAILED_PRODUCTION (Detailed seams & material divisions)</option>
                        <option value="TEXTURED">TEXTURED (Controlled pixel texturing)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-300 mb-1 flex items-center">
                        Resolution Profile
                        <Tooltip text="Target height percentage and pixel density constraints for the delivered sprite sheet." hint="Resolution Profile" />
                      </label>
                      <select
                        value={output.resolutionProfile}
                        onChange={(e) => setOutput({...output, resolutionProfile: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500 font-mono"
                      >
                        <option value="HIGH_RESOLUTION_PIXEL_ART">HIGH_RESOLUTION_PIXEL_ART (25-35% height)</option>
                        <option value="MID_RESOLUTION_PIXEL_ART">MID_RESOLUTION_PIXEL_ART (18-25% height)</option>
                        <option value="16_BIT_RETRO_PIXEL_ART">16_BIT_RETRO_PIXEL_ART (64-96px sprite scale)</option>
                        <option value="CUSTOM_PIXEL_ART">CUSTOM_PIXEL_ART (Define limits)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-300 mb-1 flex items-center">
                        Palette Limit Strategy
                        <Tooltip text="Restricts total global color count across the sprite sheet for classic 16-bit or clean modern pixel art styles." hint="Palette Strategy" />
                      </label>
                      <select
                        value={output.paletteLimit || 'RESTRAINED_64_COLOR'}
                        onChange={(e) => setOutput({...output, paletteLimit: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500 font-mono"
                      >
                        <option value="STRICT_32_COLOR">STRICT_32_COLOR (16-32 color retro target)</option>
                        <option value="RESTRAINED_64_COLOR">RESTRAINED_64_COLOR (32-64 color target - Recommended)</option>
                        <option value="EXPANDED_ALBEDO">EXPANDED_ALBEDO (Controlled value bands)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-300 mb-1 flex items-center">
                        Outline System
                        <Tooltip text="Sets pixel boundary style: dark local color, pure crisp black, or outline-less soft contrast edges." hint="Outline Style" />
                      </label>
                      <select
                        value={output.outlineStyle || 'DARK_LOCAL_CONTOUR'}
                        onChange={(e) => setOutput({...output, outlineStyle: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500 font-mono"
                      >
                        <option value="DARK_LOCAL_CONTOUR">DARK_LOCAL_CONTOUR (Local dark color 1px - Standard)</option>
                        <option value="PURE_BLACK_OUTLINE">PURE_BLACK_OUTLINE (Crisp 1px black outline)</option>
                        <option value="OUTLINE_LESS_ALBEDO">OUTLINE_LESS_ALBEDO (Soft edge contrast without outlines)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-300 mb-1 flex items-center">
                        Lighting & Shading Model
                        <Tooltip text="Controls key lighting angle and shadow intensity. Flat neutral albedo is standard for game engine lighting." hint="Lighting Model" />
                      </label>
                      <select
                        value={output.lightingModel || 'FLAT_NEUTRAL_ALBEDO'}
                        onChange={(e) => setOutput({...output, lightingModel: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500 font-mono"
                      >
                        <option value="FLAT_NEUTRAL_ALBEDO">FLAT_NEUTRAL_ALBEDO (Albedo style lighting - Standard)</option>
                        <option value="ISOMETRIC_TOP_LEFT">ISOMETRIC_TOP_LEFT (Fixed 45° key light + hard shadows)</option>
                        <option value="UNLIT_EMISSIVE_BAKED">UNLIT_EMISSIVE_BAKED (Flat unlit diffuse textures)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-300 mb-1 flex items-center">
                        Sheet Canvas Aspect Ratio
                        <Tooltip text="Defines output aspect ratio parameter passed to the AI generator to prevent image cropping." hint="Sheet Format" />
                      </label>
                      <select
                        value={output.aspectRatio || 'WIDE_16_9'}
                        onChange={(e) => setOutput({...output, aspectRatio: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500 font-mono"
                      >
                        <option value="WIDE_16_9">WIDE_16_9 (16:9 Aspect Ratio - Recommended)</option>
                        <option value="SQUARE_1_1">SQUARE_1_1 (1:1 Aspect Ratio Canvas)</option>
                        <option value="TALL_9_16">TALL_9_16 (9:16 Vertical Sheet Layout)</option>
                        <option value="ULTRAWIDE_21_9">ULTRAWIDE_21_9 (21:9 Panorama Sheet Layout)</option>
                      </select>
                    </div>
                  </div>

                </div>

                {/* RIGHT COLUMN: PROMPT OUTPUT & TARGET AI SELECTOR */}
                {}
                <div className="lg:col-span-7 space-y-4 sticky top-24">
                  
                  {/* TOP CONTROL BAR WITH TARGET AI AGENT SELECTOR */}
                  <div className="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-4 shadow-xl flex flex-wrap items-center justify-between gap-3 backdrop-blur-lg">
                    
                    {/* TARGET AI SELECTOR DROPDOWN ON TOP RIGHT */}
                    <div className="flex items-center gap-2 w-full sm:w-auto">
                      <label className="text-xs font-bold text-cyan-300 flex items-center whitespace-nowrap">
                        Target AI Agent:
                        <Tooltip 
                          text="Tailors prompt wrapping and formatting for specific AI image generators. Sol enforces reasoning contracts, Midjourney adds flags, SD/Flux adds negative prompts." 
                          hint="Target AI Generator Selector"
                          direction="bottom" 
                        />
                      </label>
                      <select
                        value={output.targetModel || 'GENERIC'}
                        onChange={(e) => setOutput({...output, targetModel: e.target.value})}
                        className="bg-slate-950 border border-indigo-500/60 rounded-xl px-3 py-1.5 text-xs text-white font-bold focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-all flex-1 sm:w-64"
                      >
                        {TARGET_MODELS.map((model) => (
                          <option key={model.id} value={model.id}>
                            {model.name}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        onClick={handleCopyJSONData}
                        className="px-3 py-1.5 bg-slate-950 hover:bg-slate-800 border border-slate-700/80 text-cyan-300 text-xs font-semibold rounded-xl transition-all flex items-center gap-1"
                        title="Copy structured JSON specification"
                      >
                        {'{ }'} Copy JSON
                      </button>
                      <button
                        onClick={handleDownloadPrompt}
                        className="px-3 py-1.5 bg-slate-950 hover:bg-slate-800 border border-slate-700/80 text-slate-200 text-xs font-semibold rounded-xl transition-all flex items-center gap-1.5"
                      >
                        💾 Download .md
                      </button>
                      <button
                        onClick={handleCopyPrompt}
                        className="px-4 py-1.5 bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white text-xs font-extrabold rounded-xl shadow-md transition-all flex items-center gap-1.5"
                      >
                        📋 Copy Prompt
                      </button>
                    </div>
                  </div>

                  {/* PROMPT BOX - CONSTRAINED MAX-HEIGHT WITH COMPILER BADGE */}
                  <div className="bg-slate-900/90 border border-slate-800/90 rounded-2xl p-5 shadow-2xl flex flex-col max-h-[560px] backdrop-blur-xl">
                    <div className="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
                      
                      <div className="flex items-center gap-2 text-xs font-mono">
                        <span className="relative flex h-2.5 w-2.5">
                          <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                          <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                        </span>
                        <span className="text-emerald-400 font-semibold tracking-wide">Realtime Compiler Active</span>
                      </div>

                      <div className="flex items-center gap-3 text-xs font-mono">
                        <span className="text-slate-400">Words: <strong className="text-cyan-400">{wordCount}</strong></span>
                        <span className="text-slate-400">Est. Tokens: <strong className="text-indigo-400">~{tokenEstimate}</strong></span>
                        <span className="text-[10px] bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 px-2 py-0.5 rounded-full">
                          Auto-Sync
                        </span>
                      </div>
                    </div>

                    {/* CONSTRAINED SCROLLABLE CONTAINER */}
                    <div className="flex-1 overflow-y-auto max-h-[460px] font-mono text-xs leading-relaxed text-slate-300 whitespace-pre-wrap select-all bg-slate-950 p-4 rounded-xl border border-slate-800/80 shadow-inner">
                      {generatedPromptText}
                    </div>
                  </div>

                </div>

              </div>
            )}

            {/* PRESETS TAB */}
            {}
            {activeTab === 'presets' && (
              <div className="space-y-6 animate-fade-in">
                <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-wrap justify-between items-center gap-4">
                  <div>
                    <h2 className="text-lg font-bold text-white">Preset Archetype Library</h2>
                    <p className="text-xs text-slate-400">Select archetype templates across characters, creatures, objects, items, and buildings.</p>
                  </div>

                  <div className="flex flex-wrap items-center gap-2 bg-slate-950 p-2 rounded-xl border border-slate-800">
                    <input
                      type="text"
                      placeholder="Custom Preset Name..."
                      value={savedPresetName}
                      onChange={(e) => setSavedPresetName(e.target.value)}
                      className="bg-slate-900 border border-slate-700 text-xs text-white rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500"
                    />
                    <button
                      onClick={handleSaveCustomPreset}
                      className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3.5 py-1.5 rounded-lg font-semibold transition-all"
                    >
                      Save Current Setup
                    </button>
                    <button
                      onClick={handleExportPresetsJSON}
                      className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg font-semibold transition-all"
                      title="Export presets as JSON"
                    >
                      📤 Export JSON
                    </button>
                    <label className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg font-semibold transition-all cursor-pointer">
                      📥 Import JSON
                      <input type="file" accept=".json" onChange={handleImportPresetsJSON} className="hidden" />
                    </label>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {[...PRESETS, ...customPresets].map((preset) => (
                    <div key={preset.id} className="bg-slate-900/80 border border-slate-800 hover:border-indigo-500/50 rounded-2xl p-5 shadow-xl transition-all hover:scale-[1.01] flex flex-col justify-between">
                      <div className="space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-[10px] font-mono px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                            {preset.category || 'CHARACTER'}
                          </span>
                          <span className="text-[10px] text-slate-500 font-mono">
                            {preset.id.startsWith('custom-') ? 'User Custom' : 'Built-in'}
                          </span>
                        </div>
                        <h3 className="text-base font-bold text-white">{preset.name}</h3>
                        <p className="text-xs text-slate-300 line-clamp-2">
                          {preset.subject.species || preset.subject.role || 'Archetype'} — {preset.subject.setting || 'Theme'}
                        </p>
                      </div>

                      <button
                        onClick={() => handleLoadPreset(preset)}
                        className="mt-4 w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl transition-all"
                      >
                        ⚡ Load Preset
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* SPEC DOC TAB */}
            {}
            {activeTab === 'spec' && (
              <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-2xl space-y-8 max-w-5xl mx-auto animate-fade-in backdrop-blur-xl">
                <div className="border-b border-slate-800 pb-6">
                  <div className="inline-block bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-3 py-1 rounded-full text-xs font-mono font-semibold mb-3">
                    TECHNICAL ARCHITECTURE SPECIFICATION DOC v3.0
                  </div>
                  <h2 className="text-2xl font-bold text-white">Sprite Gubbins v3.0 SPA — Software Specification</h2>
                </div>

                <section className="space-y-3 text-xs text-slate-300">
                  <h3 className="text-base font-bold text-cyan-400">1. Client-Side Serverless Engine</h3>
                  <p>
                    Sprite Gubbins runs entirely within the client browser without needing any backend server or API dependencies. Built as a single-page HTML/React bundle, it compiles dynamic markdown prompts in real-time based on state variables and schema definitions.
                  </p>
                </section>

                <section className="space-y-3 text-xs text-slate-300">
                  <h3 className="text-base font-bold text-cyan-400">2. ChatGPT 5.6 Sol & Target Model Optimizations</h3>
                  <p>
                    The studio incorporates grounding research for OpenAI ChatGPT 5.6 Sol. Sol prompts enforce task execution contracts, done-condition verification, and strict background isolation rules. Midjourney, Stable Diffusion/Flux, Google Imagen 3, and DALL-E 3 are also fully supported via targeted wrapper strategies.
                  </p>
                </section>

                <section className="space-y-3 text-xs text-slate-300">
                  <h3 className="text-base font-bold text-cyan-400">3. Game Dev Atlas & Grid Calculator</h3>
                  <p>
                    Integrates real-time calculations for component counts, power-of-two GPU VRAM compliance checks, bleed padding/gutter controls, interactive cell hover visualizers, and raw JSON atlas metadata export for engines like Godot, Unity, PixiJS, and Unreal.
                  </p>
                </section>

                <section className="space-y-3 text-xs text-slate-300">
                  <h3 className="text-base font-bold text-cyan-400">4. Interactive Tooltips & Visual Swatches</h3>
                  <p>
                    Features interactive info tooltips across all controls explaining setting purposes, prompt impacts, and recommended configurations. Color inputs automatically render visual hex/named color swatches.
                  </p>
                </section>
              </div>
            )}
          </main>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
