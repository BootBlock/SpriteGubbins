<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Sprite Gubbins</title>
    <meta
      name="description"
      content="Compose precise, model-targeted prompts for generating game sprite sheets and texture atlases."
    />

    <!-- The page ground, `foundry-900`. The placeholder is substituted at config time from the
         stylesheet's own oklch() declaration — a meta tag cannot read a custom property, and the
         literal that used to sit here matched no token, so the splash screen it is meant to match
         handed over to a visibly lighter page. See scripts/themeColour.ts. -->
    <meta name="theme-color" content="__THEME_COLOR__" />
    <meta name="color-scheme" content="dark" />

    <!-- Relative, not root-absolute: the site is served from /SpriteGubbins/ on GitHub Pages,
         and these resolve against the document either way. -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <!-- iOS ignores manifest icons entirely and needs its own link. -->
    <link rel="apple-touch-icon" href="icon-192.png" />

    <!-- Must run before the app: on a static host the service worker supplies the COOP/COEP
         headers SQLite's OPFS backend needs, and the first visit has to reload once after that
         worker takes control. A no-op on the dev/preview servers, which send the headers. -->
    <script src="coi-bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
