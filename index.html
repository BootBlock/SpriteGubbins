<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Sprite Gubbins</title>
    <meta
      name="description"
      content="Compose precise, model-targeted prompts for generating game sprite sheets and texture atlases."
    />

    <!-- Matches the PWA manifest's theme/background colour (foundry-900) so the browser
         chrome and the splash screen never flash a different colour than the app. -->
    <meta name="theme-color" content="#060911" />
    <meta name="color-scheme" content="dark" />

    <!-- Relative, not root-absolute: the site is served from /SpriteGubbins/ on GitHub Pages,
         and these resolve against the document either way. -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <!-- iOS ignores manifest icons entirely and needs its own link. -->
    <link rel="apple-touch-icon" href="icon-192.png" />

    <!-- Must run before the app: on a static host the service worker supplies the COOP/COEP
         headers SQLite's OPFS backend needs, and the first visit has to reload once after that
         worker takes control. A no-op on the dev/preview servers, which send the headers. -->
    <script src="coi-bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
