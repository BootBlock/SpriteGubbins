name: Deploy to GitHub Pages

# Manual-only: this never runs on push, on a pull request, or on a schedule. Publish by opening
# the repository's "Actions" tab, selecting this workflow, and clicking "Run workflow". It builds
# the chosen ref (default: main) and deploys it to https://bootblock.github.io/SpriteGubbins/.
#
# The dialog carries a version box, and it is the whole release procedure: type the version this
# release is to carry and the `release` job writes it into package.json, pushes that one commit,
# and hands every job below the commit it made — so nothing has to be edited, committed or pushed
# by hand before dispatching. Leave the box empty to redeploy whatever version package.json
# already declares, which is what a rollback and an idempotent re-run both need.
#
# Any ref can be dispatched and will be gated and built, but only `main` and a `v*` release tag
# can actually *reach* production — see the note on the `deploy` job below.
#
# `workflow_dispatch` lets the operator pick any ref — including an unmerged branch nothing has
# ever checked — and this is the app's only publish path, so the `gate` job below runs the checks
# CLAUDE.md requires locally (secret scan, types, lint, formatting, unit tests, build) against
# exactly the commit being deployed, and everything after it needs the gate. That is the only thing
# stopping a broken or credential-carrying commit reaching every user's device in one click. The
# gate takes the commit from `needs.release.outputs.sha`, and hands it to every job it runs, rather
# than taking the dispatched ref — which the version bump moves out from under the run.
#
# The gate itself is `tests.yml`, as it is in the sibling Gubbins repository: a reusable workflow
# this one invokes, which also runs on every push to `main` and on every pull request. Only that
# second half is new here. Publishing is still manual and still this file's alone — what changed is
# that a commit no longer waits for a release to find out whether it passes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.13.0 — leave empty to redeploy the version package.json already declares'
        required: false
        default: ''
        type: string

# Least-privilege. `pages: write` and `id-token: write` are what the Pages deployment needs; the
# `release` and `tag` jobs re-grant `contents: write` for themselves alone, so nothing else in this
# run can push.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time. A newer run *queues* behind an in-flight one rather than cancelling
# it: `actions/deploy-pages` killed mid-flight can leave the Pages deployment in a failed or
# indeterminate state instead of being cleanly superseded, and this is the only publish path for
# the app. Letting the first run finish is the safe ordering.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Decide what is being published, before a single second is spent building it. This is the only
  # job that reads the version box, and everything below takes the commit it names — so the gate,
  # the build, the bundle's own About badge and the `v<version>` tag all describe one commit whose
  # package.json is true. `vite.config.ts` inlines that field as `__APP_VERSION__`, which is why a
  # version entered here has to reach the file rather than only the tag: a run that tagged one
  # number and shipped a bundle displaying another would leave nobody able to say what is serving.
  #
  # Release marker, and it is checked here rather than after the build for the same reason. With no
  # tags at all, "what is currently deployed?" is unanswerable and "redeploy the last good build"
  # means picking a SHA out of `git log` by eye. The `tag` job below marks the commit it publishes
  # as `v<version>` — but that only stays meaningful if each new deploy carries a new version, so
  # refuse before a build is spent. Re-deploying the *same* commit is idempotent and allowed;
  # re-deploying different code under a version already published is not.
  #
  # The bump is pushed before the gate runs, which is deliberate: the promise this workflow makes
  # is that every check runs against exactly the commit being deployed, and that commit does not
  # exist until the bump is written. The cost is that a gate failure leaves a version bump on the
  # branch for a release that never shipped — which is self-correcting, because no tag was created,
  # so dispatching again with the box empty publishes that same version once the code is fixed.
  release:
    name: Resolve the release version
    runs-on: ubuntu-latest
    # Re-granted for this job alone, and it writes at most one commit.
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        # No `cache: npm` — this job installs nothing. The version is still pinned because `npm
        # version` rewrites package-lock.json, and which npm does that decides the lockfile format
        # it writes back: the runner image's own npm is whatever Node it ships with, and a
        # lockfileVersion written by a different major would land on the branch as a real change
        # nobody asked for. Node 25 matches `.nvmrc` and every other job here.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25

      - name: Resolve, check and record the release version
        id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          current="$(node -p "require('./package.json').version")"
          version="${REQUESTED:-$current}"

          # Refuse a malformed entry here rather than letting it become a tag nothing can order.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error title=Malformed version::\"$version\" is not a version this workflow can publish. Use MAJOR.MINOR.PATCH, optionally with a -prerelease suffix."
            exit 1
          fi

          tag="v$version"
          # Resolve to the *commit* the tag names. The tags this workflow pushes are annotated, so
          # `refs/tags/$tag` is the tag object's own SHA — comparing that to a commit would never
          # match, and every re-deploy would be rejected. `^{}` is the peeled ref (the commit); it
          # exists only for annotated tags, so fall back to the plain ref in case a lightweight one
          # was pushed by hand.
          existing="$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)"
          if [ -z "$existing" ]; then
            existing="$(git ls-remote origin "refs/tags/$tag" | cut -f1)"
          fi

          if [ "$version" = "$current" ]; then
            # Nothing to write — the box was empty, or it named the version this ref already
            # carries. Either way the deployed commit is the dispatched one.
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error title=Release version already published::Tag $tag already points at $existing, but this deploy is $GITHUB_SHA. Enter a new version in the \"Run workflow\" dialog, or dispatch $tag itself to redeploy the code it names."
              exit 1
            fi
            sha="$GITHUB_SHA"
            echo "Deploying $tag from $GITHUB_SHA — package.json already declares $version."
          else
            # A bump was asked for, so the commit that gets deployed does not exist yet and any tag
            # of this name is therefore a different commit's.
            if [ -n "$existing" ]; then
              echo "::error title=Release version already published::Tag $tag already points at $existing. Enter a version no release has used."
              exit 1
            fi
            if [ "$REF_TYPE" != "branch" ]; then
              echo "::error title=Nowhere to commit the bump::The version box asks this run to write $version into package.json, but it was dispatched against $REF_TYPE \"$REF_NAME\", which has no branch to commit to. Dispatch a branch, or leave the box empty to redeploy the version this ref already declares."
              exit 1
            fi
            # `npm version` writes package.json and package-lock.json together, which is what `npm
            # ci` in every job below needs: the lockfile records the root package's version too,
            # and an install against a lockfile that disagrees is refused.
            npm version "$version" --no-git-tag-version > /dev/null
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Release $version" -m "Written by the deploy workflow from the version box of run $GITHUB_RUN_ID. This commit is what the run gates, builds, deploys and tags."
            # A non-fast-forward here means the branch moved under the run. Failing is right: the
            # gate would otherwise describe a commit nobody asked to deploy.
            git push origin "HEAD:refs/heads/$REF_NAME"
            sha="$(git rev-parse HEAD)"
            echo "Bumped $current to $version and pushed $sha to $REF_NAME."
          fi

          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  # The gate, which is now one definition rather than this file's own copy of it.
  #
  # These jobs used to be inlined here, with a note saying they were inlined because Sprite Gubbins
  # had no push or pull-request workflow to delegate to. It has one now — `tests.yml` runs the same
  # secret scan, type-check, lint, format check, unit tests and build on every push to `main` and on
  # every pull request — so the deploy calls it instead of restating it. One definition means a
  # check added to the gate is a check a release runs, without anybody remembering to add it twice.
  #
  # `sha` is what makes the promise above literally true: every job in the called workflow checks
  # out the commit `release` resolved, which is the version bump rather than the dispatched ref
  # whenever the version box asked for one.
  gate:
    name: Gate
    needs: release
    uses: ./.github/workflows/tests.yml
    with:
      sha: ${{ needs.release.outputs.sha }}
      upload-dist: true

  # Package what the gate built, and hand it to Pages.
  #
  # This job used to build the tree itself, which meant a release published a *second* build of the
  # commit — one that no check had been run against. The gate uploads its `dist/` when the deploy
  # asks for it (`upload-dist: true`), so the bytes that reach a reader's device are the bytes the
  # secret scan, the type-check, the lint, the tests and the build's own guards were run over. A
  # push or a pull request leaves that input alone and uploads nothing.
  #
  # Nothing here needs a checkout: `actions/download-artifact` fetches the bundle from the gate,
  # which ran in this same workflow run, and the two Pages actions read only that directory.
  build:
    name: Package for Pages
    needs: [release, gate]
    runs-on: ubuntu-latest
    steps:
      - name: Download the built bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # The `github-pages` environment carries a deployment branch policy, so it — not this file — has
  # the final say on which refs may publish. GitHub creates that environment restricted to the
  # default branch alone, which would have made the rollback story above a fiction: a `v*` tag is
  # not a branch, so re-dispatching against one would pass every gate, spend a full build, and
  # then be refused here. The policy is therefore set to `main` + tag `v*` — deliberately narrow,
  # so a dispatch of some unmerged branch still cannot reach users, while a rollback can.
  #
  # One record this job writes is knowingly one commit behind, and the tag is the answer to it.
  # `actions/deploy-pages` takes the deployment's commit from the workflow run's own context and
  # exposes no input to set it, so a run that wrote a version bump records the deployment against
  # the ref it was dispatched from rather than against the commit it actually built. Measured on
  # the 0.13.0 release: the environment names the parent while the artefact, and the bundle serving
  # from it, are the bump. `v<version>` is therefore the *record* of what is deployed, which is what
  # the `tag` job below exists for — read that, not the Deployments list, to answer "which commit is
  # serving?".
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Published for the release body, which quotes where this run actually deployed to rather than
    # restating the project site's address and hoping the two agree.
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Record what was published. Runs only after the deploy actually succeeded, so a tag means "this
  # commit reached production", not "someone tried". That gives the rollback story its missing
  # first half: `git tag` lists every release, `v<version>` names the commit serving right now,
  # and re-running this workflow against an earlier tag redeploys it.
  #
  # The Release is the same record, published where a reader will actually meet it. A bare tag is
  # invisible from the repository's front page and carries only the one line this job writes into
  # it, so for four releases the Releases page said nothing at all. The tag stays the machine-
  # readable answer to "which commit is serving?"; the Release is the human-readable one, and
  # GitHub writes its body from the commits since the previous tag.
  #
  # Both steps are idempotent and independent. Re-dispatching an existing tag leaves the tag alone
  # and still publishes a Release if one is missing, which is what makes this job able to catch up
  # a release that was tagged before it published anything.
  tag:
    name: Tag and publish the release
    needs: [release, build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Tag the deployed commit
        env:
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Idempotent: re-deploying the same commit re-runs this, and the `release` job has
          # already guaranteed any existing tag of this name points here.
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)" ]; then
            echo "$TAG already recorded for this commit — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tags HEAD, which the checkout above pinned to the commit that was gated, built and
          # deployed — not $GITHUB_SHA, which is the dispatched ref and is one commit behind
          # whenever the version box asked for a bump.
          git tag -a "$TAG" -m "Sprite Gubbins $VERSION — deployed to GitHub Pages by run $GITHUB_RUN_ID."
          git push origin "refs/tags/$TAG"
          echo "Recorded release $TAG at $(git rev-parse HEAD)."

      - name: Publish the release
        env:
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already published — nothing to do."
            exit 0
          fi

          # The release before this one, which is the highest tag sorting BELOW it — not the highest
          # other tag. Those differ whenever the tag being published is not the newest, which is both
          # of the cases this has to get right: a rollback re-deploying an older tag, and a catch-up
          # publish of a tag pushed before this step existed. Taking the maximum of the rest would
          # hand GitHub a *newer* start tag and produce an empty set of notes.
          #
          # `--refs` drops the peeled `^{}` entries these annotated tags also publish. `sort -V` is
          # not semver: it orders `v1.0.0-rc.1` after `v1.0.0` rather than before it, so a
          # prerelease can be chosen as the predecessor of the release that followed it. That costs
          # a slightly short range of notes and nothing else.
          remote_tags="$(git ls-remote --tags --refs origin 'refs/tags/v*' | awk '{print $2}' | sed 's#refs/tags/##')"
          previous="$({ echo "$remote_tags"; echo "$TAG"; } | sort -V -u | awk -v tag="$TAG" '$0 == tag { print prev; exit } { prev = $0 }')"

          # GitHub writes the body from the commits between the two tags. Passing the start tag
          # rather than letting it be inferred is what keeps that range right when releases and
          # tags disagree about which is newest.
          notes_args="-f tag_name=$TAG"
          if [ -n "$previous" ]; then
            notes_args="$notes_args -f previous_tag_name=$previous"
          fi
          # Word splitting is what builds the argument list here, and every value in it is a version
          # string this workflow already refused unless it matched MAJOR.MINOR.PATCH.
          # shellcheck disable=SC2086
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" $notes_args --jq .body > "$RUNNER_TEMP/notes.md"

          # What was deployed, above the generated list, because that is the question a reader opens
          # a release to answer. Both files are written to the runner's temp directory rather than
          # into the checkout, which is a git working tree this job has no business dirtying.
          {
            echo "Deployed to ${PAGE_URL:-https://bootblock.github.io/SpriteGubbins/} from commit $(git rev-parse HEAD) by run $GITHUB_RUN_ID."
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/body.md"

          # `--verify-tag` refuses to invent a tag: this publishes the one the step above pushed, or
          # it fails.
          gh release create "$TAG" --verify-tag --title "Sprite Gubbins $VERSION" --notes-file "$RUNNER_TEMP/body.md"
          echo "Published $TAG."
