name: Tests

# The verification gate CLAUDE.md requires locally, run by GitHub on every push to every branch —
# and, through `workflow_call`, on the exact commit `deploy.yml` is about to publish.
#
# It is also the gate `main` now stands behind. The ruleset on the default branch requires this
# workflow's four checks on the commit being merged or pushed, so a run here is no longer advice
# that a reader may take or leave (issue #297).
#
# Until this file existed the gate ran in one place only: a manual deploy. CodeQL ran on every
# push and nothing else did, so a commit that failed to type-check, lint, format, test or build
# could sit on `main` for days, and the first thing that would report it was a release somebody
# had to dispatch by hand. Several agents land into `main` concurrently and each verifies its own
# worktree, so the combination that actually reaches the branch is the one nobody ran the gate
# against. This runs it there.
#
# It does not replace the local gate. Running it here is what makes the branch's commit landable at
# all, and running it locally first is what stops a round trip to GitHub being spent to learn that.
on:
  # Every branch, and no `pull_request` trigger, because a required status check reads the check
  # runs attached to a COMMIT. A `push` run attaches the four required ones to the commit it ran, and
  # that one set then answers for the branch, for a pull request opened from it, and for a
  # fast-forward of `main` onto it. Adding `pull_request` back would check the same commit twice.
  #
  # `main` is where the gap was: several agents land into it concurrently and each verifies its own
  # worktree, so the combination that reaches the branch is one nobody ran the gate against. Every
  # other branch is here because the ruleset on `main` now requires these four checks on whatever
  # is merged or pushed, and a run of this workflow is the only thing that can put them there.
  #
  # `branches`, not a bare `push`, so a `v*` release tag does not re-run a gate `deploy.yml` has
  # already run through `workflow_call` on that exact commit.
  #
  # A pull request from a FORK therefore gets no run at all, because pushing to a fork raises no
  # event here, and its four checks stay expected forever. For an OUTSIDE author that is the
  # intended end: `close-external-pull-requests.yml` closes their pull request on sight. A
  # collaborator's fork is exempt from that workflow, so a collaborator branches in this
  # repository rather than in a fork.
  push:
    branches: ['**']
  workflow_call:
    inputs:
      upload-dist:
        description: 'Upload the built dist/ as an artifact named "dist", for a caller that deploys it.'
        required: false
        default: false
        type: boolean

# Least privilege, and it is what the caller's own grant is narrowed to: every job here only reads
# the tree. `deploy.yml` grants `pages: write` and `id-token: write` for the jobs it keeps to
# itself, and calling this workflow cannot pass them on.
permissions:
  contents: read

# A newer push supersedes an older one on the same ref, because only the newest commit is worth a
# verdict. A `workflow_call` run is deliberately in a different group and is never cancelled: it is
# the gate a release is waiting on, and `github.event_name` inside a called workflow is the
# caller's event, so a push landing on `main` mid-release cannot cancel the deploy's gate.
#
# `main` is excluded for a different reason. A commit that reaches it has already passed, so its
# run there is a record rather than a verdict — and a cancelled run would leave a commit that is
# on `main` displaying `cancelled` where the four greens ought to be.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

jobs:
  # This repository is PUBLIC, and a commit's contents are permanent from the moment they are
  # pushed. `.githooks/pre-commit` scans only what a commit adds — deliberately, so a value that has
  # always lived in a committed fixture is not re-flagged forever — but it runs on one developer's
  # machine, and `git commit --no-verify` or a clone that never ran `npm install` skips it entirely.
  # This job runs the same scanner (`scripts/secret-scan.ts`), so the two can never drift, in two
  # passes, because each one reads something the other cannot.
  #
  # The TREE pass diffs the empty tree against the tip, which makes every tracked line and every
  # tracked binary file count as added. It reports anything credential-shaped the tip still holds,
  # however long ago it arrived. It compares two trees and walks no commits, so it cannot see a
  # value a commit added and a later commit deleted.
  #
  # The HISTORY pass is what sees that (issue #444). It scans each commit the ref introduces against
  # its parents, so a value added in one commit and deleted in the next is reported at the commit
  # that added it, before the branch can land. That needs the whole history, hence `fetch-depth: 0`:
  # a depth-1 checkout holds the tip alone. Which commits it reads is set out on the step.
  #
  # What either pass does and does not read inside a file, because a gate is worth only what it
  # actually reads. A file git calls binary contributes no lines to a diff at all, so it is fetched
  # whole and its bytes are scanned — at one-, two- and four-byte spacings, at every offset, which
  # reads ASCII, UTF-8, UTF-16 and UTF-32 in either endianness (issue #211). That reaches a
  # credential stored as one byte per ASCII character: a UTF-16 source file, a `.pem`, a SQLite
  # page, a PNG text chunk. It does not reach one inside a compressed or encoded stream — a zip, a
  # gzip, a PNG `IDAT` — because those bytes are not present until something decompresses them, and
  # nothing here does; nor one in an encoding laid out some other way, such as EBCDIC.
  #
  # Running it on every push to every branch is the change: the deploy ran this against the
  # commit it was about to publish, which is the last moment it can be asked, and by then the value
  # has been on `main` for however long it sat there.
  # Every job checks out `github.sha` explicitly. Inside a reusable workflow that is the CALLER's
  # commit, so a deploy gates the ref it was dispatched against — the same commit it builds, ships
  # and tags.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Every commit and every branch, so the history pass can read each commit it walks and
          # can name `origin/main` as the point the walk stops.
          fetch-depth: 0

      - name: Set up Node
        # No `cache: npm` — this job installs nothing. The scanner has no dependencies and reads
        # only git. It does need this Node: it is TypeScript run directly, so the runtime has to be
        # one that strips types, which is why the version is still pinned.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Scan the tree for credential-shaped content
        # `git hash-object -t tree /dev/null` computes this repository's empty-tree id rather than
        # hard-coding 4b825dc…, which is correct only for a SHA-1 repository. Nothing is written:
        # without `-w` the id is calculated, not stored.
        run: node scripts/secret-scan.ts --diff "$(git hash-object -t tree /dev/null)"

      - name: Scan every commit this ref introduces
        # Runs even when the tree pass failed, so one run reports both lists.
        #
        # On any branch but `main` the walk is `origin/main..HEAD`: every commit this ref holds
        # that `main` does not. That is every commit the branch would bring to `main`, so a green
        # verdict here answers for all of them, and it re-reads the commits of the branch's earlier
        # pushes, which costs seconds and keeps each verdict whole. A deploy is called with the
        # dispatch's event, so it takes this walk too, and on `main` or a release tag it is empty:
        # those commits were walked on the branch that landed them.
        #
        # A push to `main` itself has no `origin/main` to stop at, because the checkout's
        # `origin/main` is the pushed commit. It walks `before..HEAD`, the commits this push added
        # to the branch. The ruleset admits only a commit that already passed these checks on a
        # branch, so this walk is the backstop for a push that bypassed it. `before` is all zeros only when a
        # push creates the branch, and git then refuses the range, so the step fails rather than
        # reading nothing.
        if: ${{ !cancelled() }}
        env:
          PUSH_TO_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$PUSH_TO_MAIN" = true ]; then
            range="$BEFORE..HEAD"
          else
            range="origin/main..HEAD"
          fi
          node scripts/secret-scan.ts --commits "$range"

  quality:
    name: Lint, format & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The Node, and so the npm, a developer is told to use. `npm ci` never rewrites the
          # lockfile, so it could not notice an npm that disagrees with it; `engine-strict` in
          # `.npmrc` refuses one below the floor in `package.json` instead.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail fast on types first, then lint, then formatting — cheapest signal last.
      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  # The suite in three shards on three runners, because one runner was most of the gate's wall
  # clock: Vitest spent over six minutes there, against under a minute for every other job. Three
  # rather than more because Vitest assigns files to shards by a hash of their paths, not by how long
  # they take, and at three every shard already finishes with the slowest single files it holds;
  # a fourth adds a runner without shortening the run. A file that grows past a minute or so on its
  # own is the next thing to split, since no shard count can run one file faster.
  #
  # `fail-fast: false` so that one run lists every failing file, as the secret scan does for its two
  # passes. A shard cancelled halfway would hide the failures it had not reached yet.
  test:
    name: Unit tests (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The pure utilities — the prompt compiler and the atlas maths — are where this app's
      # correctness actually lives.
      - name: Run unit tests
        run: npm run test:run -- --shard=${{ matrix.shard }}/3

  # The check the ruleset on `main` requires is named `Unit tests`, and a matrix names each of its
  # jobs after its own values, so this job carries that name and passes only when every shard did.
  #
  # `always()`, and never a plain `needs`, because a required check that is SKIPPED counts as
  # passed. Without it a failed or cancelled shard would skip this job, and the ruleset would read
  # that as a green `Unit tests`. It checks nothing out and installs nothing, so running it after a
  # cancellation costs seconds.
  unit-tests:
    name: Unit tests
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to have passed
        env:
          SHARDS: ${{ needs.test.result }}
        run: |
          if [ "$SHARDS" != success ]; then
            echo "::error title=Unit tests::The unit-test shards finished as '$SHARDS', not 'success'."
            exit 1
          fi
          echo "Every unit-test shard passed."

  # `npm run build` is a check in its own right and not only a way to get a bundle. The build's own
  # `closeBundle` guards — the dead-utility sweep and the precache contract — fail there and nowhere
  # else, because Vitest never builds, so a tree that type-checks, lints and tests green can still
  # fail here. `tests/dead-utilities.test.ts` says the same thing from the other side: it drives the
  # pure half of that guard precisely because the whole question can only be asked at build time.
  #
  # It is also the job that produces the bundle a release publishes. `upload-dist` is how the deploy
  # asks for it, and the artefact it uploads is built from the same commit every other job checks.
  #
  # It runs beside the other jobs rather than after them, because it needs nothing they produce, and
  # waiting for them added its whole run to the gate's. That costs no safety: the ruleset on `main`
  # requires every check on its own, and `deploy.yml` publishes the artefact only after the whole
  # gate has passed, so a bundle built beside a failing test is never shipped.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `vite.config.ts` pins `base: '/SpriteGubbins/'`, so the build needs no environment at all.
      # This app handles no API key by design, so there is deliberately no secret to wire in here.
      - name: Build
        run: npm run build

      # Three production-only mechanisms have no unit test that can catch their absence, and all of
      # them fail silently. `404.html` is the byte copy of the app shell that makes a refresh or a
      # shared deep link resolve on GitHub Pages. `sw.js` is the `injectManifest` worker that adds
      # the cross-origin isolation headers Pages itself will never send. `manifest.webmanifest` is
      # what makes the app installable. A build that emitted none of them would still exit 0.
      - name: Verify the build output
        run: |
          missing=0
          for artefact in index.html 404.html sw.js manifest.webmanifest; do
            if [ ! -s "dist/$artefact" ]; then
              echo "::error title=Missing build output::dist/$artefact was not emitted, or is empty."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "dist/ carries the app shell, the SPA 404 fallback, the service worker and the manifest."

      # Only for a caller that is going to publish it. A push leaves the input at
      # its default and uploads nothing, so the ordinary gate costs no storage — and a release gets
      # to deploy the exact bytes every check above was run against, rather than a second build of
      # the same commit that nothing checked. One day is long enough: the artefact is consumed by
      # the next job in the same run and is of no use afterwards.
      - name: Upload the built bundle
        if: inputs.upload-dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 1
