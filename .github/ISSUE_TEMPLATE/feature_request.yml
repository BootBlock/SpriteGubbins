name: Feature request
description: Something the app should be able to do and cannot.
labels: ['type: feature', 'status: triage']
body:
  - type: markdown
    attributes:
      value: |
        The app composes prompt text for image models and finishes the sheets they return. It makes
        no model calls of its own and handles no API key, by design — so a request that needs one is
        a different application rather than an addition to this one.

  - type: textarea
    id: problem
    attributes:
      label: What you were trying to do
      description: The task, not the feature. What were you making, and where did the app stop being useful?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do today instead
      description: Whether you work around it, do it in another tool, or go without.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Where it belongs
      options:
        - Studio — subject fields, output configuration, the compiled prompt
        - Quantise — keying, pixel snapping, palette reduction, the written files
        - Presets — saving, loading, importing, exporting
        - Atlas calculator — layouts, VRAM budgets, engine metadata
        - Sheet splitter — cutting a sheet into runs
        - History — what the app remembers between sessions
        - A target model, or the wording it is sent
        - Somewhere else
    validations:
      required: false
